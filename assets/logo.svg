<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="#0F172A"/>
  
  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#grad1)" stroke-width="4" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#38BDF8" stroke-width="3" opacity="0.4"/>

  <!-- Central Nexus Core -->
  <circle cx="256" cy="256" r="48" fill="url(#grad1)" filter="url(#glow)"/>
  <polygon points="256,232 276,268 236,268" fill="#FFFFFF"/>

  <!-- Satellite Agent Nodes -->
  <!-- Product & Strategy Node (Top) -->
  <circle cx="256" cy="96" r="28" fill="#F43F5E"/>
  <circle cx="256" cy="96" r="14" fill="#FFFFFF" opacity="0.9"/>
  <line x1="256" y1="124" x2="256" y2="208" stroke="#F43F5E" stroke-width="3" stroke-dasharray="4 4"/>

  <!-- Architecture & Orchestration (Top Right) -->
  <circle cx="390" cy="170" r="26" fill="#8B5CF6"/>
  <line x1="370" y1="185" x2="295" y2="235" stroke="#8B5CF6" stroke-width="3"/>

  <!-- Engineering & Dev (Bottom Right) -->
  <circle cx="390" cy="342" r="26" fill="#06B6D4"/>
  <line x1="370" y1="327" x2="295" y2="277" stroke="#06B6D4" stroke-width="3"/>

  <!-- Security & Audit (Bottom) -->
  <circle cx="256" cy="416" r="28" fill="#10B981"/>
  <circle cx="256" cy="416" r="12" fill="#FFFFFF" opacity="0.9"/>
  <line x1="256" y1="388" x2="256" y2="304" stroke="#10B981" stroke-width="3" stroke-dasharray="4 4"/>

  <!-- QA & Testing (Bottom Left) -->
  <circle cx="122" cy="342" r="26" fill="#EAB308"/>
  <line x1="142" y1="327" x2="217" y2="277" stroke="#EAB308" stroke-width="3"/>

  <!-- Code Quality & Optimization (Top Left) -->
  <circle cx="122" cy="170" r="26" fill="#3B82F6"/>
  <line x1="142" y1="185" x2="217" y2="235" stroke="#3B82F6" stroke-width="3"/>
</svg>
